kernel_sizes: None
filters: None
pool_type: "max"
first_conv_stride: 4
first_conv_padding: "same" # "valid" reproduces legacy behavior; use "same" for less aggressive temporal shrinkage
pool_kernel_size: 3
pool_stride: 2
pool_after_blocks: [0, 1, 2, 3] # block indices after which pooling is applied
use_final_pool: true
dense_units: [128, 128]
initializer: "glorot_uniform"

# Output head mode:
# - "dual": detector + classifier (current/default behavior)
# - "single": one 3-class head (noise/earthquake/explosion)
head_mode: "single"

# Toggle to swap the dense head for a Transformer encoder head.
use_transformer_head: true
transformer:
  d_model: 256          # Projection size for tokens; defaults to final conv channels when null
  nhead: 4              # Number of attention heads
  num_layers: 2         # Encoder layers
  dim_feedforward: 512  # Feed-forward hidden dim inside each encoder layer
  dropout: 0.1
  activation: "gelu"
  use_dual_cls_tokens: false  # If true, allocate separate cls tokens for detector and classifier
